<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 670" width="920" height="670" role="img" aria-labelledby="10-git-rollout-title 10-git-rollout-desc" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="10-git-rollout-title">Release theo một commit và rollback có điều kiện</title>
<desc id="10-git-rollout-desc">Sửa, test, build trên Mac hoặc WSL rồi commit push và tạo artifacts cùng commit. Thiết bị kiểm maintenance, backup, checkout đúng commit và install matching wheel; kiểm hash/readiness trước ghi SOURCE_COMMIT. Khi thất bại chỉ rollback wheel nếu dữ liệu tương thích; migration cần backup và đối soát, không restore mù.</desc>
<defs><marker id="10-git-rollout-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#617687"/></marker></defs>
<rect width="920" height="100%" rx="16" fill="#fff"/>
<polyline points="400,71 520,71" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#10-git-rollout-arrow)"/>
<polyline points="700,117 700,144 570,144 570,171" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#10-git-rollout-arrow)"/>
<polyline points="460,253 460,296" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#10-git-rollout-arrow)"/>
<polyline points="460,378 460,421" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#10-git-rollout-arrow)"/>
<polyline points="315,476 230,476 230,572" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#10-git-rollout-arrow)"/>
<polyline points="605,476 690,476 690,572" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#10-git-rollout-arrow)"/>
<g data-box="true"><rect x="40" y="25" width="360" height="92" rx="12" fill="#edf5fb" stroke="#8cb6d2" stroke-width="1.5"/><text x="220" y="53" fill="#174d71" font-size="17" font-weight="650" text-anchor="middle"><tspan x="220" dy="0">Mac / WSL</tspan></text><text x="220" y="81" fill="#174d71" font-size="16" font-weight="400" text-anchor="middle"><tspan x="220" dy="0">Sửa → test → build</tspan><tspan x="220" dy="23">Commit / push; artifacts cùng commit</tspan></text></g>
<g data-box="true"><rect x="520" y="25" width="360" height="92" rx="12" fill="#f3f6f9" stroke="#c9d4df" stroke-width="1.5"/><text x="700" y="53" fill="#243849" font-size="17" font-weight="650" text-anchor="middle"><tspan x="700" dy="0">GitHub + bộ release</tspan></text><text x="700" y="81" fill="#243849" font-size="16" font-weight="400" text-anchor="middle"><tspan x="700" dy="0">Commit cố định</tspan><tspan x="700" dy="23">Wheel • dependencies • checksums</tspan></text></g>
<g data-box="true"><rect x="235" y="171" width="450" height="82" rx="12" fill="#fff7e6" stroke="#d8b56e" stroke-width="1.5"/><text x="460" y="206" fill="#785715" font-size="17" font-weight="650" text-anchor="middle"><tspan x="460" dy="0">Linux: kiểm trước update</tspan></text><text x="460" y="234" fill="#785715" font-size="16" font-weight="400" text-anchor="middle"><tspan x="460" dy="0">Disk • job/CUPS • maintenance • backup</tspan></text></g>
<g data-box="true"><rect x="235" y="296" width="450" height="82" rx="12" fill="#f3f6f9" stroke="#c9d4df" stroke-width="1.5"/><text x="460" y="331" fill="#243849" font-size="17" font-weight="650" text-anchor="middle"><tspan x="460" dy="0">Checkout + install</tspan></text><text x="460" y="359" fill="#243849" font-size="16" font-weight="400" text-anchor="middle"><tspan x="460" dy="0">Đúng commit; stop service; matching wheel</tspan></text></g>
<polygon points="460,421 605,476 460,531 315,476" fill="#edf5fb" stroke="#8cb6d2" stroke-width="1.5"/>
<text x="460" y="470" fill="#243849" font-size="17" font-weight="400" text-anchor="middle"><tspan x="460" dy="0">Kiểm tra activation đạt?</tspan><tspan x="460" dy="24">Hash • UI • readiness</tspan></text>
<g data-box="true"><rect x="35" y="572" width="390" height="78" rx="12" fill="#edf7f2" stroke="#90bba4" stroke-width="1.5"/><text x="230" y="605" fill="#245c43" font-size="17" font-weight="650" text-anchor="middle"><tspan x="230" dy="0">Ghi SOURCE_COMMIT</tspan></text><text x="230" y="633" fill="#245c43" font-size="16" font-weight="400" text-anchor="middle"><tspan x="230" dy="0">Giữ previous release; cleanup key tạm</tspan></text></g>
<text x="270" y="455" fill="#243849" font-size="15" font-weight="400" text-anchor="middle"><tspan x="270" dy="0">Đạt</tspan></text>
<g data-box="true"><rect x="495" y="572" width="390" height="78" rx="12" fill="#fff7e6" stroke="#d8b56e" stroke-width="1.5"/><text x="690" y="605" fill="#785715" font-size="17" font-weight="650" text-anchor="middle"><tspan x="690" dy="0">Rollback được duyệt</tspan></text><text x="690" y="633" fill="#785715" font-size="16" font-weight="400" text-anchor="middle"><tspan x="690" dy="0">Tương thích dữ liệu? Hay cần đối soát?</tspan></text></g>
<text x="650" y="455" fill="#243849" font-size="15" font-weight="400" text-anchor="middle"><tspan x="650" dy="0">Lỗi</tspan></text>
</svg>
