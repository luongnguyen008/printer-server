<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 605" width="920" height="605" role="img" aria-labelledby="06-option-permissions-title 06-option-permissions-desc" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="06-option-permissions-title">Khả năng máy không đồng nghĩa quyền client</title>
<desc id="06-option-permissions-desc">CUPS và driver cung cấp capability. Admin chọn defaults và các giá trị override. Client chỉ thấy quyền được cấp; dùng mặc định bỏ khóa đó. Server kiểm enum, constraints và fingerprint, lưu effective options trong snapshot. ZPL không dùng PDF options.</desc>
<defs><marker id="06-option-permissions-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#617687"/></marker></defs>
<rect width="920" height="100%" rx="16" fill="#fff"/>
<polyline points="230,121 230,150 350,150 350,181" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#06-option-permissions-arrow)"/>
<polyline points="690,121 690,150 570,150 570,181" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#06-option-permissions-arrow)"/>
<polyline points="350,277 350,303 230,303 230,337" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#06-option-permissions-arrow)"/>
<polyline points="400,384 520,384" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#06-option-permissions-arrow)"/>
<polyline points="690,431 690,461 570,461 570,491" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#06-option-permissions-arrow)"/>
