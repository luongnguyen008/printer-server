<g data-box="true"><rect x="520" y="25" width="340" height="96" rx="12" fill="#edf5fb" stroke="#8cb6d2" stroke-width="1.5"/><text x="690" y="55" fill="#174d71" font-size="17" font-weight="650" text-anchor="middle"><tspan x="690" dy="0">Quản trị máy</tspan></text><text x="690" y="83" fill="#174d71" font-size="16" font-weight="400" text-anchor="middle"><tspan x="690" dy="0">Mặc định appliance</tspan><tspan x="690" dy="23">Các giá trị client được chọn</tspan></text></g>
<g data-box="true"><rect x="240" y="181" width="440" height="96" rx="12" fill="#f3f6f9" stroke="#c9d4df" stroke-width="1.5"/><text x="460" y="211" fill="#243849" font-size="17" font-weight="650" text-anchor="middle"><tspan x="460" dy="0">Schema theo printer_id</tspan></text><text x="460" y="239" fill="#243849" font-size="16" font-weight="400" text-anchor="middle"><tspan x="460" dy="0">Capability ∩ quyền được cấp</tspan><tspan x="460" dy="23">Fingerprint để phát hiện thay đổi</tspan></text></g>
<g data-box="true"><rect x="60" y="337" width="340" height="94" rx="12" fill="#f3f6f9" stroke="#c9d4df" stroke-width="1.5"/><text x="230" y="366" fill="#243849" font-size="17" font-weight="650" text-anchor="middle"><tspan x="230" dy="0">Client chọn</tspan></text><text x="230" y="394" fill="#243849" font-size="16" font-weight="400" text-anchor="middle"><tspan x="230" dy="0">Dùng mặc định → bỏ khóa</tspan><tspan x="230" dy="23">Override → chọn giá trị được cấp</tspan></text></g>
<g data-box="true"><rect x="520" y="337" width="340" height="94" rx="12" fill="#edf7f2" stroke="#90bba4" stroke-width="1.5"/><text x="690" y="366" fill="#245c43" font-size="17" font-weight="650" text-anchor="middle"><tspan x="690" dy="0">Server kiểm tra</tspan></text><text x="690" y="394" fill="#245c43" font-size="16" font-weight="400" text-anchor="middle"><tspan x="690" dy="0">Enum • constraints • mapping</tspan><tspan x="690" dy="23">Không tin form client</tspan></text></g>
<g data-box="true"><rect x="240" y="491" width="440" height="85" rx="12" fill="#edf7f2" stroke="#90bba4" stroke-width="1.5"/><text x="460" y="527" fill="#245c43" font-size="17" font-weight="650" text-anchor="middle"><tspan x="460" dy="0">Snapshot của job mới</tspan></text><text x="460" y="555" fill="#245c43" font-size="16" font-weight="400" text-anchor="middle"><tspan x="460" dy="0">Tùy chọn hiệu lực không tự đổi về sau</tspan></text></g>
