<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 715" width="920" height="715" role="img" aria-labelledby="09-backup-restore-title 09-backup-restore-desc" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="09-backup-restore-title">Backup và restore là hai quy trình có điều kiện</title>
<desc id="09-backup-restore-desc">Backup maintenance kiểm nonterminal jobs và CUPS, dừng service và kiểm lại rồi lưu full data cùng cấu hình/artifacts, checksum và bản ngoài thiết bị. Restore phải đối soát jobs mới sau backup, lưu trạng thái hiện tại, dùng package tương thích, kiểm integrity/snapshot/nonterminal rồi mới start. DB-only không đủ phục hồi payload.</desc>
<defs><marker id="09-backup-restore-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#617687"/></marker></defs>
<rect width="920" height="100%" rx="16" fill="#fff"/>
<polyline points="232,217 232,254" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#09-backup-restore-arrow)"/>
<polyline points="232,352 232,389" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#09-backup-restore-arrow)"/>
<polyline points="232,487 232,524" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#09-backup-restore-arrow)"/>
<polyline points="687,217 687,254" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#09-backup-restore-arrow)"/>
<polyline points="687,352 687,389" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#09-backup-restore-arrow)"/>
<polyline points="687,487 687,524" fill="none" stroke="#617687" stroke-width="1.8" marker-end="url(#09-backup-restore-arrow)"/>
<g data-box="true"><rect x="35" y="20" width="395" height="62" rx="12" fill="#edf5fb" stroke="#8cb6d2" stroke-width="1.5"/><text x="232" y="57" fill="#174d71" font-size="17" font-weight="650" text-anchor="middle"><tspan x="232" dy="0">BACKUP ĐẦY ĐỦ</tspan></text></g>
<g data-box="true"><rect x="490" y="20" width="395" height="62" rx="12" fill="#fff7e6" stroke="#d8b56e" stroke-width="1.5"/><text x="687" y="57" fill="#785715" font-size="17" font-weight="650" text-anchor="middle"><tspan x="687" dy="0">RESTORE CÓ KIỂM SOÁT</tspan></text></g>
<g data-box="true"><rect x="35" y="119" width="395" height="98" rx="12" fill="#f3f6f9" stroke="#c9d4df" stroke-width="1.5"/><text x="232" y="150" fill="#243849" font-size="17" font-weight="650" text-anchor="middle"><tspan x="232" dy="0">Maintenance được phép</tspan></text><text x="232" y="178" fill="#243849" font-size="16" font-weight="400" text-anchor="middle"><tspan x="232" dy="0">Không còn app nonterminal</tspan><tspan x="232" dy="23">CUPS không có job chờ</tspan></text></g>
<g data-box="true"><rect x="35" y="254" width="395" height="98" rx="12" fill="#f3f6f9" stroke="#c9d4df" stroke-width="1.5"/><text x="232" y="285" fill="#243849" font-size="17" font-weight="650" text-anchor="middle"><tspan x="232" dy="0">Stop service và kiểm lại</tspan></text><text x="232" y="313" fill="#243849" font-size="16" font-weight="400" text-anchor="middle"><tspan x="232" dy="0">Tránh job vừa được nhận</tspan><tspan x="232" dy="23">Không backup bằng copy DB sống</tspan></text></g>
<g data-box="true"><rect x="35" y="389" width="395" height="98" rx="12" fill="#f3f6f9" stroke="#c9d4df" stroke-width="1.5"/><text x="232" y="420" fill="#243849" font-size="17" font-weight="650" text-anchor="middle"><tspan x="232" dy="0">Archive được bảo vệ</tspan></text><text x="232" y="448" fill="#243849" font-size="16" font-weight="400" text-anchor="middle"><tspan x="232" dy="0">DB + spool + cấu hình + artifacts</tspan><tspan x="232" dy="23">Checksum • kiểm archive • off-device</tspan></text></g>
<g data-box="true"><rect x="35" y="524" width="395" height="98" rx="12" fill="#f3f6f9" stroke="#c9d4df" stroke-width="1.5"/><text x="232" y="555" fill="#243849" font-size="17" font-weight="650" text-anchor="middle"><tspan x="232" dy="0">Start service sau backup</tspan></text><text x="232" y="583" fill="#243849" font-size="16" font-weight="400" text-anchor="middle"><tspan x="232" dy="0">Kiểm readiness / service</tspan><tspan x="232" dy="23">Backup driver có kế hoạch riêng</tspan></text></g>
<g data-box="true"><rect x="490" y="119" width="395" height="98" rx="12" fill="#fff7e6" stroke="#d8b56e" stroke-width="1.5"/><text x="687" y="150" fill="#785715" font-size="17" font-weight="650" text-anchor="middle"><tspan x="687" dy="0">Duyệt quyết định restore</tspan></text><text x="687" y="178" fill="#785715" font-size="16" font-weight="400" text-anchor="middle"><tspan x="687" dy="0">Đối soát jobs nhận sau backup</tspan><tspan x="687" dy="23">Backup trạng thái hiện tại</tspan></text></g>
<g data-box="true"><rect x="490" y="254" width="395" height="98" rx="12" fill="#fff7e6" stroke="#d8b56e" stroke-width="1.5"/><text x="687" y="285" fill="#785715" font-size="17" font-weight="650" text-anchor="middle"><tspan x="687" dy="0">Giữ service dừng</tspan></text><text x="687" y="313" fill="#785715" font-size="16" font-weight="400" text-anchor="middle"><tspan x="687" dy="0">Restore app data đúng phạm vi</tspan><tspan x="687" dy="23">Dùng package/schema tương thích</tspan></text></g>
<g data-box="true"><rect x="490" y="389" width="395" height="98" rx="12" fill="#fff7e6" stroke="#d8b56e" stroke-width="1.5"/><text x="687" y="420" fill="#785715" font-size="17" font-weight="650" text-anchor="middle"><tspan x="687" dy="0">Kiểm trước activation</tspan></text><text x="687" y="448" fill="#785715" font-size="16" font-weight="400" text-anchor="middle"><tspan x="687" dy="0">Integrity • snapshot • nonterminal</tspan><tspan x="687" dy="23">Chưa đạt → giữ dừng, đối soát</tspan></text></g>
<g data-box="true"><rect x="490" y="524" width="395" height="98" rx="12" fill="#fff7e6" stroke="#d8b56e" stroke-width="1.5"/><text x="687" y="555" fill="#785715" font-size="17" font-weight="650" text-anchor="middle"><tspan x="687" dy="0">Start chỉ khi đủ điều kiện</tspan></text><text x="687" y="583" fill="#785715" font-size="16" font-weight="400" text-anchor="middle"><tspan x="687" dy="0">Không coi backup cũ là chưa in</tspan><tspan x="687" dy="23">Giữ bản before-restore</tspan></text></g>
<text x="460" y="691" fill="#53616f" font-size="15" font-weight="400" text-anchor="middle"><tspan x="460" dy="0">Backup SQLite online chỉ có DB. Full restore cần payload và đối soát kết quả in.</tspan></text>
</svg>
